<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASML Label Printer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

/* ─── TOKENS ─────────────────────────────── */
:root {
  --navy:   #0F238C;
  --blue:   #1297E4;
  --yellow: #EAE136;
  --bg:     #f0f3fa;
  --card:   #ffffff;
  --border: #dce3f0;
  --text:   #0d1a3a;
  --muted:  #6b7a99;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ─── HEADER ─────────────────────────────── */
.hdr {
  width: 100%;
  background: var(--navy);
  padding: 0 32px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 12px rgba(15,35,140,.35);
}
.hdr-logo { font-size: 24px; font-weight: 800; color: #fff; letter-spacing: -1px; }
.hdr-logo b { color: var(--yellow); font-weight: 800; }
.hdr-pill {
  background: var(--yellow); color: var(--navy);
  font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; padding: 4px 10px; border-radius: 4px;
}
.hdr-sub { font-size: 11px; color: rgba(255,255,255,.4); letter-spacing: 2px; text-transform: uppercase; }
.hdr-right { display: flex; align-items: center; gap: 16px; }

.accent { width: 100%; height: 3px; background: linear-gradient(90deg, var(--yellow), var(--blue) 50%, var(--navy)); }

/* ─── LAYOUT ─────────────────────────────── */
.wrap {
  width: 100%;
  max-width: 960px;
  padding: 32px 20px 60px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ─── CARD ───────────────────────────────── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 24px;
  box-shadow: 0 2px 12px rgba(15,35,140,.06);
}
.card-hd {
  font-size: 10px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; color: var(--navy);
  border-bottom: 2px solid var(--yellow);
  padding-bottom: 10px; margin-bottom: 20px;
  display: flex; align-items: center; gap: 8px;
}
.card-hd svg { width: 13px; height: 13px; }

/* ─── FORM ROW ───────────────────────────── */
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 14px;
  align-items: end;
}
.field label {
  display: block; font-size: 10px; font-weight: 600;
  letter-spacing: 1px; text-transform: uppercase;
  color: var(--muted); margin-bottom: 6px;
}
.field input {
  width: 100%;
  border: 1.5px solid var(--border); border-radius: 8px;
  padding: 11px 14px;
  font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 500;
  color: var(--text); background: #fff; outline: none;
  transition: border-color .15s, box-shadow .15s;
  appearance: none; -webkit-appearance: none;
}
.field input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(18,151,228,.14);
}
.field input::-webkit-calendar-picker-indicator { cursor: pointer; opacity: .45; }

/* Qty */
.qty-wrap { display: flex; border: 1.5px solid var(--border); border-radius: 8px; overflow: hidden; }
.qty-btn {
  width: 44px; height: 44px; border: none; background: var(--bg);
  color: var(--navy); font-size: 22px; font-weight: 500;
  cursor: pointer; transition: background .12s;
  display: flex; align-items: center; justify-content: center; user-select: none;
}
.qty-btn:hover { background: #daeef9; }
.qty-num {
  width: 52px; text-align: center; font-size: 18px; font-weight: 700; color: var(--navy);
  border: none; border-left: 1.5px solid var(--border); border-right: 1.5px solid var(--border);
  outline: none; padding: 0; font-family: inherit; background: #fff;
}
.qty-num::-webkit-inner-spin-button,
.qty-num::-webkit-outer-spin-button { -webkit-appearance: none; }

/* Print button */
.print-btn {
  width: 100%; margin-top: 16px; padding: 14px;
  background: var(--navy); color: #fff; border: none; border-radius: 8px;
  font-family: inherit; font-size: 13px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: background .15s, transform .1s;
  position: relative; overflow: hidden;
}
.print-btn::after {
  content: ''; position: absolute; bottom: 0; left: 0;
  width: 100%; height: 3px; background: var(--yellow);
  transform: scaleX(0); transform-origin: left; transition: transform .2s;
}
.print-btn:hover { background: #142fa8; transform: translateY(-1px); }
.print-btn:hover::after { transform: scaleX(1); }
.print-btn:active { transform: none; }
.print-btn svg { width: 16px; height: 16px; }

/* Printer info */
.pinfo {
  margin-top: 14px; padding: 10px 14px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  font-size: 11px; color: var(--muted);
  display: flex; align-items: center; gap: 8px;
}
.pinfo svg { width: 13px; height: 13px; color: var(--navy); flex-shrink: 0; }
.pinfo strong { color: var(--navy); }

/* ─── PREVIEW SECTION ────────────────────── */
.prev-hd {
  font-size: 10px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; color: var(--blue);
  border-bottom: 2px solid var(--blue);
  padding-bottom: 10px; margin-bottom: 18px;
  display: flex; align-items: center; gap: 8px;
}
.prev-hd svg { width: 13px; height: 13px; }

/* Preview container — fills card width, fixed height, hard clip */
.prev-wrap {
  background: #e2e8f5;
  background-image: radial-gradient(#c5cedf 1px, transparent 1px);
  background-size: 14px 14px;
  border-radius: 10px;
  padding: 14px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/*
  Label: fills the container width, aspect-ratio 3:1 (76.2÷25.4).
  No fixed pixel widths — fully responsive.
  No transforms. Overflow hidden clips the barcode SVG.
*/
.slabel {
  width: 100%;
  aspect-ratio: 3 / 1;
  background: #fff;
  border-radius: 4px;
  box-shadow: 0 3px 16px rgba(0,0,0,.18);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Navy header — proportional height */
.sl-hdr {
  flex: 0 0 23%;
  background: var(--navy);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 3%;
}
.sl-logo {
  font-size: clamp(10px, 2.5vw, 18px);
  font-weight: 800; color: #fff; letter-spacing: -0.5px; line-height: 1;
}
.sl-logo b { color: var(--yellow); }
.sl-sub {
  font-size: clamp(6px, 1vw, 9px);
  font-weight: 600; letter-spacing: 1px;
  text-transform: uppercase; color: rgba(255,255,255,.55);
}

/* Body: date at top, time at bottom, max separation */
.sl-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 3% 3%;
  min-height: 0;
}

/* Each row identical — takes natural equal space */
.sl-row {
  flex: 0 0 auto;
  height: 36%;
  display: flex;
  align-items: center;
  gap: 2%;
  min-width: 0;
  overflow: hidden;
}

.sl-tag {
  font-size: clamp(7px, 1.2vw, 11px);
  font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase; color: #999;
  flex: 0 0 9%;
  line-height: 1;
}

/* Barcode: takes most of the row, clips cleanly */
.sl-bc {
  flex: 1;
  min-width: 0;
  height: 100%;
  display: flex;
  align-items: center;
  overflow: hidden;
}
.sl-bc svg {
  width: 100% !important;
  height: 100% !important;
  display: block;
}

/* Value: fixed percentage width so it always shows */
.sl-val {
  flex: 0 0 22%;
  text-align: right;
  font-size: clamp(8px, 1.4vw, 13px);
  font-weight: 800;
  color: #000;
  letter-spacing: 0.3px;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.prev-meta {
  margin-top: 12px;
  display: flex; justify-content: space-between;
  font-size: 11px; color: var(--muted);
}
.prev-meta strong { color: var(--navy); }

/* ─── TOAST ──────────────────────────────── */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--navy); color: #fff;
  padding: 12px 22px; border-radius: 8px;
  font-size: 13px; font-weight: 500;
  display: flex; align-items: center; gap: 10px;
  box-shadow: 0 4px 20px rgba(15,35,140,.4);
  border-bottom: 3px solid var(--yellow);
  transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  z-index: 999; white-space: nowrap;
}
.toast.up { transform: translateX(-50%) translateY(0); }

/* ─── PRINT AREA (hidden on screen) ─────── */
#pa { display: none; }

/* ══════════════════════════════════════════
   PRINT CSS
   Target: Altec ATP-600 Pro, 600dpi
   Driver stock: 101.6 × 152.4mm
   Physical label (from photo): landscape ~76×25mm
   We send one page per label at @page 76.2×25.4mm.
   All colours stripped — thermal = black only.
   No gradients, no coloured backgrounds.
   ASML logo = bold black text.
══════════════════════════════════════════ */
@media print {

  @page {
    size: 76.2mm 25.4mm landscape;
    margin: 0;
  }

  html, body {
    margin: 0; padding: 0;
    width: 76.2mm; height: 25.4mm;
    background: #fff;
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }

  body > *:not(#pa) { display: none !important; }
  #pa { display: block !important; }

  /* One label per page */
  .pl {
    width: 76.2mm;
    height: 25.4mm;
    background: #fff;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    page-break-after: always;
    page-break-inside: avoid;
  }
  .pl:last-child { page-break-after: auto; }

  /* ASML header — black box, white text */
  .pl-hdr {
    height: 6mm;
    background: #000 !important;
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2.5mm;
    flex-shrink: 0;
  }
  .pl-logo {
    font-family: 'Inter', Arial, sans-serif;
    font-size: 9pt; font-weight: 800; color: #fff !important;
    letter-spacing: -0.3px; line-height: 1;
    print-color-adjust: exact; -webkit-print-color-adjust: exact;
  }
  .pl-sub {
    font-family: 'Inter', Arial, sans-serif;
    font-size: 4.5pt; font-weight: 600; letter-spacing: 1px;
    text-transform: uppercase; color: #bbb !important;
    print-color-adjust: exact; -webkit-print-color-adjust: exact;
  }

  /* Body: date at top, time at bottom */
  .pl-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 0.8mm 2.5mm 0.8mm;
  }

  /* Each row: identical fixed height */
  .pl-row {
    height: 8.2mm;
    display: flex;
    align-items: center;
    gap: 1.5mm;
    overflow: hidden;
  }

  /* Tag label */
  .pl-tag {
    font-family: 'Inter', Arial, sans-serif;
    font-size: 5pt; font-weight: 700; letter-spacing: 0.5px;
    text-transform: uppercase; color: #555;
    width: 5.5mm; flex-shrink: 0; line-height: 1;
  }

  /* Barcode area — fills remaining width */
  .pl-bc {
    flex: 1;
    height: 7.5mm;
    display: flex;
    align-items: center;
    min-width: 0;
    overflow: hidden;
  }
  /* Both SVGs: same height, fill available width */
  .pl-bc svg {
    width: 100% !important;
    height: 7.5mm !important;
    display: block;
  }

  /* Human-readable value — large and bold */
  .pl-val {
    font-family: 'Inter', Arial, sans-serif;
    font-size: 10pt; font-weight: 800; color: #000;
    letter-spacing: 1px;
    width: 18mm; flex-shrink: 0;
    text-align: right; line-height: 1;
  }
}

@media (max-width: 640px) {
  .form-row { grid-template-columns: 1fr 1fr; }
  .form-row .qty-field { grid-column: span 2; }
}

</style>
</head>
<body>

<!-- Header -->
<div class="hdr">
  <div style="display:flex;align-items:center;gap:14px">
    <div class="hdr-logo">A<b>S</b>ML</div>
    <div class="hdr-pill">Label Printer</div>
  </div>
  <div class="hdr-right">
    <div class="hdr-sub">Receiving &amp; Logistics</div>
  </div>
</div>
<div class="accent"></div>

<div class="wrap">

  <!-- Controls card -->
  <div class="card">
    <div class="card-hd">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="2" y="2" width="12" height="12" rx="1.5"/>
        <line x1="5" y1="7" x2="5" y2="11"/><line x1="8" y1="5" x2="8" y2="11"/><line x1="11" y1="8" x2="11" y2="11"/>
      </svg>
      Configure Label
    </div>

    <div class="form-row">
      <div class="field">
        <label>Date</label>
        <input type="date" id="iDate">
      </div>
      <div class="field">
        <label>Time</label>
        <input type="time" id="iTime">
      </div>
      <div class="field qty-field">
        <label>Copies</label>
        <div class="qty-wrap">
          <button class="qty-btn" id="qMinus">−</button>
          <input type="number" class="qty-num" id="iQty" value="1" min="1" max="99">
          <button class="qty-btn" id="qPlus">+</button>
        </div>
      </div>
    </div>

    <div class="pinfo">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4,6 4,1 12,1 12,6"/>
        <path d="M4 11H2a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-2"/>
        <rect x="4" y="10" width="8" height="5"/>
      </svg>
      <span><strong>Altec ATP-600 Pro</strong> · 600 DPI · Thermal · Label: <strong>76.2 × 25.4 mm</strong> landscape</span>
    </div>

    <button class="print-btn" id="btnPrint">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4,6 4,1 12,1 12,6"/>
        <path d="M4 11H2a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-2"/>
        <rect x="4" y="10" width="8" height="5"/>
      </svg>
      Print Labels
    </button>
  </div>

  <!-- Preview card -->
  <div class="card">
    <div class="prev-hd">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="1" y="1" width="14" height="14" rx="2"/>
        <line x1="4" y1="5" x2="12" y2="5"/><line x1="4" y1="9" x2="10" y2="9"/><line x1="4" y1="13" x2="8" y2="13"/>
      </svg>
      Live Preview · 76.2 × 25.4 mm
    </div>

    <div class="prev-wrap">
      <!-- Screen label: 480×130px, no transforms -->
      <div class="slabel">
        <div class="sl-hdr">
          <div class="sl-logo">A<b>S</b>ML</div>
          <div class="sl-sub">Receiving &amp; Logistics</div>
        </div>
        <div class="sl-body">
          <div class="sl-row">
            <div class="sl-tag">Date</div>
            <div class="sl-bc"><svg id="bcDatePrev"></svg></div>
            <div class="sl-val" id="vDate">—</div>
          </div>
          <div class="sl-row">
            <div class="sl-tag">Time</div>
            <div class="sl-bc"><svg id="bcTimePrev"></svg></div>
            <div class="sl-val" id="vTime">—</div>
          </div>
        </div>
      </div>
    </div>

    <div class="prev-meta">
      <span>Barcode: <strong>DDMMYYYY</strong> / <strong>HHMM</strong> · CODE128</span>
      <span id="metaCopies">Copies: <strong>1</strong></span>
    </div>
  </div>

</div><!-- /wrap -->

<!-- Print output -->
<div id="pa"></div>

<!-- Toast -->
<div class="toast" id="toast">
  <span id="toastIcon">✓</span>
  <span id="toastMsg">Sent to printer</span>
</div>

<script>
const g = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');

/* Set defaults to current date/time */
(function(){
  const n = new Date();
  g('iDate').value = `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`;
  g('iTime').value = `${pad(n.getHours())}:${pad(n.getMinutes())}`;
})();

/* Format helpers */
function fmtBcDate(iso){ // "YYYY-MM-DD" → "DDMMYYYY"
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return d+m+y;
}
function fmtDispDate(iso){ // "YYYY-MM-DD" → "DD.MM.YYYY"
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}.${m}.${y}`;
}
function fmtBcTime(t){ return t ? t.replace(':','') : ''; } // "HH:MM" → "HHMM"
function fmtDispTime(t){ return t || '—'; }

/* Barcode options — identical for both so they render same size */
const BCOPTS = {
  format:'CODE128', width:2, height:60,
  displayValue:false, margin:2,
  lineColor:'#000', background:'#fff'
};

function drawBC(el, val){
  if(!val){ el.innerHTML=''; return; }
  try {
    JsBarcode(el, val, BCOPTS);
    /* Strip auto width/height — CSS controls display size */
    el.removeAttribute('width');
    el.removeAttribute('height');
  } catch(e){ el.innerHTML=''; }
}

/* Qty controls */
function clamp(){
  let v = parseInt(g('iQty').value)||1;
  v = Math.max(1, Math.min(99, v));
  g('iQty').value = v;
  return v;
}
g('qMinus').onclick = () => { g('iQty').value = Math.max(1,(parseInt(g('iQty').value)||1)-1); update(); };
g('qPlus').onclick  = () => { g('iQty').value = Math.min(99,(parseInt(g('iQty').value)||1)+1); update(); };

/* Update preview */
function update(){
  const d = g('iDate').value;
  const t = g('iTime').value;
  const qty = clamp();

  drawBC(g('bcDatePrev'), fmtBcDate(d) || '01012025');
  drawBC(g('bcTimePrev'), fmtBcTime(t) || '0800');

  g('vDate').textContent = fmtDispDate(d);
  g('vTime').textContent = fmtDispTime(t);
  g('metaCopies').innerHTML = `Copies: <strong>${qty}</strong>`;
}

['iDate','iTime','iQty'].forEach(id => {
  g(id).addEventListener('input', update);
  g(id).addEventListener('change', update);
});

/* Build print DOM */
function buildPrint(){
  const d = g('iDate').value;
  const t = g('iTime').value;
  const qty = clamp();
  const bcd = fmtBcDate(d);
  const bct = fmtBcTime(t);
  const dd  = fmtDispDate(d);
  const dt  = fmtDispTime(t);

  const pa = g('pa');
  pa.innerHTML = '';

  for(let i=0; i<qty; i++){
    const el = document.createElement('div');
    el.className = 'pl';
    el.innerHTML = `
      <div class="pl-hdr">
        <div class="pl-logo">ASML</div>
        <div class="pl-sub">Receiving &amp; Logistics</div>
      </div>
      <div class="pl-body">
        <div class="pl-row">
          <div class="pl-tag">Date</div>
          <div class="pl-bc"><svg id="pd${i}"></svg></div>
          <div class="pl-val">${dd}</div>
        </div>
        <div class="pl-row">
          <div class="pl-tag">Time</div>
          <div class="pl-bc"><svg id="pt${i}"></svg></div>
          <div class="pl-val">${dt}</div>
        </div>
      </div>
    `;
    pa.appendChild(el);
    if(bcd) drawBC(el.querySelector(`#pd${i}`), bcd);
    if(bct) drawBC(el.querySelector(`#pt${i}`), bct);
  }
}

/* Toast */
function toast(msg, ok=true){
  g('toastIcon').textContent = ok ? '✓' : '⚠';
  g('toastMsg').textContent  = msg;
  const t = g('toast');
  t.classList.add('up');
  setTimeout(()=>t.classList.remove('up'), 3000);
}

/* Print */
g('btnPrint').addEventListener('click', ()=>{
  if(!g('iDate').value || !g('iTime').value){
    toast('Please fill in date and time', false); return;
  }
  const qty = clamp();
  buildPrint();
  setTimeout(()=>{
    window.print();
    toast(`${qty} label${qty>1?'s':''} sent to printer`);
  }, 150);
});

window.addEventListener('afterprint', ()=>{ g('pa').innerHTML=''; });

update();
</script>
</body>
</html>
